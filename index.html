<!-- PWA: rejestracja service workera (offline + instalacja). Wymaga kontekstu bezpiecznego
     (http://localhost lub https) — pod zwykłym file:// przeglądarki nie pozwalają na Service Workery,
     więc aplikacja wtedy po prostu działa normalnie, tylko bez trybu "zainstaluj jako aplikację". -->
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', function () {
      function tryRegister(attemptsLeft) {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          if (attemptsLeft > 0) {
            setTimeout(function () { tryRegister(attemptsLeft - 1); }, 1200);
          } else {
            console.warn('[PWA] Rejestracja service workera nie powiodła się:', err);
          }
        });
      }
      setTimeout(function () { tryRegister(4); }, 800);
    });
  }
</script>
